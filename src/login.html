<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>OldChat for Kivotos</title>
    <link rel="icon" href="assets/oldchat_logo.png" type="image/png">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="app.css">
    <style>
        /* 登录页专属样式（保留 web.py 原样，粉色卡片） */
        .login-header {
            background: #fa94a6;
            color: #fff;
            padding: 13px 12px;
            font-size: 15px;
            font-weight: 500;
            text-align: center;
            flex-shrink: 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-header .login-title {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            pointer-events: none;
        }
        /* Tauri 环境下的窗口控制按钮（仅最小化 + 关闭，无最大化） */
        .login-win-controls {
            display: none;
            align-items: center;
            gap: 2px;
            -webkit-app-region: no-drag;
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
        }
        .login-win-controls .win-ctrl-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 32px;
            width: 36px;
            line-height: 1;
            transition: background-color 0.15s ease;
        }
        .login-win-controls .win-ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .login-win-controls .win-ctrl-btn:active {
            background: rgba(255, 255, 255, 0.3);
        }
        .tauri-env .login-win-controls {
            display: flex;
        }
        /* 安卓（手机/平板）无窗口概念：隐藏自绘窗口控制键，不卡宽度（平板也能命中）。 */
        body.android .login-win-controls {
            display: none !important;
        }
        /* 手机视图：隐藏自绘窗口控制键（最小化/关闭）。安卓/手机无窗口概念，这些键无意义。 */
        @media (max-width: 768px) {
            .tauri-env .login-win-controls {
                display: none !important;
            }
        }
        .tauri-env .login-header {
            -webkit-app-region: drag;
        }
        .login-body {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-card {
            background: var(--chat-bg);
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 380px;
            overflow: hidden;
        }
        .login-card-top {
            padding: 32px 24px 0;
            text-align: center;
        }
        .login-card-top h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #fa94a6;
        }
        .login-card-body { padding: 24px; }
        .tab-group { display: flex; gap: 0; margin-bottom: 20px; }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--secondary-text);
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
        }
        .tab.active { color: #fa94a6; border-bottom: 2px solid #fa94a6; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 14px; }
        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.9rem;
            font-family: inherit;
            background: var(--bg);
            outline: none;
            color: var(--text);
            transition: 0.2s;
        }
        .form-group input:focus {
            border-color: #fa94a6;
            box-shadow: 0 0 0 3px rgba(250,148,166,0.15);
        }
        .form-group input::placeholder { color: var(--secondary-text); }
        .email-row { display: flex; gap: 8px; }
        .email-row input { flex: 1; min-width: 0; }
        .email-send-btn {
            flex-shrink: 0; padding: 0 14px; height: 42px;
            border: none; border-radius: 10px; background: #fa94a6;
            color: #fff; font-size: 0.85rem; cursor: pointer; font-family: inherit;
        }
        .email-send-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin: 0 0 16px 0; }
        .checkbox-group input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: #fa94a6; }
        .checkbox-group label { font-size: 0.85rem; color: var(--secondary-text); cursor: pointer; user-select: none; }
        .login-card button[type="submit"] {
            width: 100%; padding: 11px; background: #fa94a6; color: #fff;
            border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 500;
            cursor: pointer; transition: background 0.2s; font-family: inherit;
        }
        .login-card button[type="submit"]:hover { background: #e88294; }
        .login-card button[type="submit"]:active { transform: scale(0.98); }
        .login-card button[type="submit"]:disabled { opacity: 0.7; cursor: not-allowed; }
        .msg-error {
            background: #fff0f0; color: #c23d3d; padding: 8px 12px;
            border-radius: 8px; font-size: 0.82rem; margin-bottom: 14px; text-align: center;
        }
        .msg-success {
            background: #f0fff4; color: #2d8a4e; padding: 8px 12px;
            border-radius: 8px; font-size: 0.82rem; margin-bottom: 14px; text-align: center;
        }
        .extra-note { text-align: center; margin-top: 20px; font-size: 0.7rem; color: var(--secondary-text); }
        /* GeeTest 验证码状态 */
        .geetest-status {
            font-size: 0.78rem; padding: 6px 10px; border-radius: 6px;
            margin-bottom: 10px; text-align: center; display: none;
        }
        .geetest-status.passed { display: block; background: #f0fff4; color: #2d8a4e; }
        .geetest-status.failed { display: block; background: #fff0f0; color: #c23d3d; }
        [data-theme-mode="dark"] .login-header { background: #16213e; }
        [data-theme-mode="dark"] .login-card-top h1 { color: #8aa0b8; }
        [data-theme-mode="dark"] .tab { color: #a0a0a0; }
        [data-theme-mode="dark"] .tab.active { color: #e0e0e0; border-bottom-color: #8aa0b8; }
        [data-theme-mode="dark"] .login-card button[type="submit"] { background: #8aa0b8; }
        [data-theme-mode="dark"] .login-card button[type="submit"]:hover { background: #7a90a8; }
        [data-theme-mode="dark"] .msg-error { background: #3a1a1a; color: #ff6b6b; }
        [data-theme-mode="dark"] .msg-success { background: #1a3a1a; color: #6bff6b; }
        [data-theme-mode="dark"] .geetest-status.passed { background: #1a3a1a; color: #6bff6b; }
        [data-theme-mode="dark"] .geetest-status.failed { background: #3a1a1a; color: #ff6b6b; }
        body { display: flex; flex-direction: column; }
    </style>
</head>
<body>
    <div class="login-header">
        <span class="login-title">OldChat for Kivotos</span>
        <div class="login-win-controls" id="loginWinControls">
            <button class="win-ctrl-btn" id="loginWinMinBtn" title="最小化"><i class="fa-solid fa-minus"></i></button>
            <button class="win-ctrl-btn" id="loginWinCloseBtn" title="关闭"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </div>
    <div class="login-body">
        <div class="login-card">
            <div class="login-card-top">
                <h1>欢迎回来</h1>
            </div>
            <div class="login-card-body">
                <div id="message"></div>
                <div class="tab-group">
                    <div class="tab active" data-tab="login">登录</div>
                    <div class="tab" data-tab="register">注册</div>
                </div>
                <div class="tab-content active" id="login-form">
                    <form id="loginForm">
                        <div class="form-group">
                            <input type="text" name="identifier" id="identifier" placeholder="账号 / 邮箱 / UID" required autofocus>
                        </div>
                        <div class="form-group">
                            <input type="password" name="password" id="password" placeholder="密码" required>
                        </div>
                        <div class="checkbox-group" style="display:flex;gap:16px;">
                            <div style="display:flex;align-items:center;gap:6px;">
                                <input type="checkbox" id="rememberAccountCheckbox">
                                <label for="rememberAccountCheckbox">记住账号</label>
                            </div>
                        </div>
                        <button type="submit">登录</button>
                    </form>
                </div>
                <div class="tab-content" id="register-form">
                    <div class="geetest-status" id="geetestStatus"></div>
                    <form id="registerForm">
                        <div class="form-group">
                            <input type="email" name="email" id="reg-email" placeholder="邮箱（仅支持 @qq.com / @vip.qq.com）" required>
                        </div>
                        <div class="form-group">
                            <input type="text" name="username" id="reg-username" placeholder="用户名" required>
                        </div>
                        <div class="form-group">
                            <input type="password" name="password" id="reg-password" placeholder="密码（至少6位）" required>
                        </div>
                        <div class="form-group email-row">
                            <input type="text" id="reg-email-code" placeholder="邮箱验证码" required>
                            <button type="button" class="email-send-btn" id="reg-send-email-btn">发送验证码</button>
                        </div>
                        <div id="geetestCaptchaContainer" style="margin-bottom:10px;"></div>
                        <button type="submit">注册</button>
                    </form>
                </div>
                <div class="extra-note">OldChat for Kivotos</div>
            </div>
        </div>
    </div>
    <script src="https://static.geetest.com/v4/gt4.js"></script>
    <script>
        // ===== Tauri 环境检测（仅用于判断 Tauri API 是否可用） =====
        var IS_TAURI = false;
        try {
            IS_TAURI = !!(window.__TAURI__ !== undefined || window.__TAURI_INTERNALS__ !== undefined);
        } catch (e) { IS_TAURI = false; }
        var BACKEND_ORIGIN = 'http://oc.mcl0.dpdns.org';
        try {
            var saved = localStorage.getItem('oc_custom_base_url');
            if (saved) {
                var firstCand = String(saved).split(/[\s,]+/)[0];
                if (firstCand) BACKEND_ORIGIN = firstCand;
            }
        } catch (e) {}

        // ===== Tauri 环境下替换 fetch 为 plugin-http invoke =====
        (function initTauri() {
            if (!IS_TAURI) return;
            var invoke = (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) ||
                         (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke);
            if (!invoke) return;

            var nativeFetch = window.fetch.bind(window);
            function isIpcUrl(input) {
                var url = typeof input === 'string' ? input : (input && input.url) || '';
                return url.indexOf('ipc.localhost') !== -1 || url.indexOf('tauri://') === 0;
            }

            window.fetch = async function (input, init) {
                if (isIpcUrl(input)) return nativeFetch(input, init);
                init = init || {};
                var req = new Request(input, init);
                var t0 = performance.now();
                try {
                    var headersObj = init.headers
                        ? (init.headers instanceof Headers ? init.headers : new Headers(init.headers))
                        : new Headers();
                    var buffer = await req.arrayBuffer();
                    var data = buffer.byteLength !== 0 ? Array.from(new Uint8Array(buffer)) : null;
                    for (var hPair of req.headers.entries()) {
                        if (!headersObj.get(hPair[0])) headersObj.set(hPair[0], hPair[1]);
                    }
                    var mappedHeaders = [];
                    for (var hEntry of headersObj.entries()) mappedHeaders.push([hEntry[0], typeof hEntry[1] === 'string' ? hEntry[1] : String(hEntry[1])]);
                    var rid = await invoke('plugin:http|fetch', {
                        clientConfig: {
                            method: req.method, url: req.url, headers: mappedHeaders, data: data
                        }
                    });
                    var sendResp = await invoke('plugin:http|fetch_send', { rid: rid });
                    var status = sendResp.status;
                    var statusText = sendResp.statusText;
                    var respUrl = sendResp.url || req.url;
                    var responseHeaders = sendResp.headers || [];
                    var responseRid = sendResp.rid;
                    var NO_BODY_STATUSES = [101, 103, 204, 205, 304];
                    var body = NO_BODY_STATUSES.indexOf(status) === -1 ? new ReadableStream({
                        start: function(controller) {
                            if (init.signal) {
                                if (init.signal.aborted) { controller.error(new Error('Request cancelled')); invoke('plugin:http|fetch_cancel_body', { rid: responseRid }).catch(function(){}); }
                                init.signal.addEventListener('abort', function() { controller.error(new Error('Request cancelled')); invoke('plugin:http|fetch_cancel_body', { rid: responseRid }).catch(function(){}); });
                            }
                        },
                        pull: async function(controller) {
                            var chunkData;
                            try { chunkData = await invoke('plugin:http|fetch_read_body', { rid: responseRid }); } catch (e) { controller.error(e); return; }
                            var u8 = new Uint8Array(chunkData);
                            if (u8.byteLength === 0) { controller.close(); return; }
                            var lastByte = u8[u8.byteLength - 1];
                            var actualData = u8.slice(0, u8.byteLength - 1);
                            if (lastByte === 1) { if (actualData.byteLength > 0) controller.enqueue(actualData); controller.close(); return; }
                            controller.enqueue(actualData);
                        },
                        cancel: function() { invoke('plugin:http|fetch_cancel_body', { rid: responseRid }).catch(function(){}); }
                    }) : null;
                    var res = new Response(body, { status: status, statusText: statusText });
                    Object.defineProperty(res, 'url', { value: respUrl, writable: false });
                    Object.defineProperty(res, 'headers', { value: new Headers(responseHeaders), writable: false });
                    return res;
                } catch (err) {
                    console.error('[Tauri fetch error]', err, '| input:', input);
                    throw err;
                }
            };
            console.log('[Tauri] fetch 已替换为 plugin:http invoke，直连后端：' + BACKEND_ORIGIN);

            window.addEventListener('keydown', function(e) {
                if (e.key === 'F12') {
                    if (e.ctrlKey && e.altKey && e.shiftKey) { e.preventDefault(); invoke('toggle_devtools').catch(function(err) { console.error('[Tauri] toggle_devtools:', err); }); }
                    else { e.preventDefault(); }
                }
            });
            document.body.classList.add('tauri-env');

            // 安卓（手机/平板）无窗口概念：标记 body.android，CSS 据此隐藏自绘窗口控件
            if (/android/i.test(navigator.userAgent)) {
                document.body.classList.add('android');
            }

            var loginWinMinBtn = document.getElementById('loginWinMinBtn');
            var loginWinCloseBtn = document.getElementById('loginWinCloseBtn');
            if (loginWinMinBtn) loginWinMinBtn.addEventListener('click', function() { invoke('minimize_window').catch(function(err) { console.error('[Tauri] minimize_window:', err); }); });
            if (loginWinCloseBtn) loginWinCloseBtn.addEventListener('click', function() { invoke('close_window').catch(function(err) { console.error('[Tauri] close_window:', err); }); });
        })();

        // 主题初始化
        (function() {
            var theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme-mode', theme);
        })();

        // ===== Tab 切换 =====
        document.querySelectorAll('.tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
                document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + '-form').classList.add('active');
                if (tab.dataset.tab === 'register') {
                    initGeetestCaptcha();
                }
            });
        });

        var msgEl = document.getElementById('message');
        function showMsg(msg, type) {
            msgEl.innerHTML = '<div class="msg-' + type + '">' + msg + '</div>';
            setTimeout(function() { msgEl.innerHTML = ''; }, 5000);
        }
        function formatError(err) {
            if (!err) return '未知错误';
            if (typeof err === 'string') return err;
            var msg = err.message || err.msg || err.error || '';
            return msg || (err.toString ? err.toString() : '未知错误');
        }
        function getDeviceId() {
            var id = localStorage.getItem('oldchat_device_id');
            if (id) return id;
            if (crypto && typeof crypto.randomUUID === 'function') { id = crypto.randomUUID(); }
            else { id = 'web-' + Date.now() + '-' + Math.random().toString(36).slice(2, 12); }
            localStorage.setItem('oldchat_device_id', id);
            return id;
        }

        // ===== GeeTest 4.0 人机验证 =====
        var geetestCaptchaObj = null;
        var geetestInitialized = false;
        var geetestVerified = false;
        var geetestResult = null; // { lot_number, captcha_output, pass_token, gen_time }

        function initGeetestCaptcha() {
            if (geetestInitialized) return;
            if (typeof initGeetest4 !== 'function') {
                console.warn('[GeeTest] gt4.js 未加载完成，重试中...');
                setTimeout(initGeetestCaptcha, 500);
                return;
            }
            geetestInitialized = true;
            initGeetest4({
                captchaId: '769d069177e132e46eeba07a6210cf3a',
                product: 'float',
                riskType: 'ai',
                language: 'zho'
            }, function(captchaObj) {
                geetestCaptchaObj = captchaObj;
                captchaObj.appendTo('#geetestCaptchaContainer');
                captchaObj.onReady(function() {
                    console.log('[GeeTest] 验证码已就绪');
                });
                captchaObj.onSuccess(function() {
                    var result = captchaObj.getValidate();
                    if (result) {
                        geetestVerified = true;
                        geetestResult = result;
                        var statusEl = document.getElementById('geetestStatus');
                        statusEl.className = 'geetest-status passed';
                        statusEl.textContent = '✓ 人机验证通过';
                        console.log('[GeeTest] 验证通过:', result);
                    }
                });
                captchaObj.onError(function(err) {
                    console.error('[GeeTest] 验证错误:', err);
                    var statusEl = document.getElementById('geetestStatus');
                    statusEl.className = 'geetest-status failed';
                    statusEl.textContent = '✗ 人机验证失败，请重试';
                });
                captchaObj.onClose(function() {
                    console.log('[GeeTest] 验证弹窗关闭');
                });
            });
        }

        // ===== API 基地址：固定直连后端（plugin-http 自带跨域能力） =====
        function getApiBase() {
            return BACKEND_ORIGIN;
        }

        // ===== 自动填充 =====
        (function autoFill() {
            try {
                var savedId = localStorage.getItem('savedIdentifier');
                var savedPwd = localStorage.getItem('savedPassword');
                if (savedId) document.getElementById('identifier').value = savedId;
                if (savedPwd) document.getElementById('password').value = savedPwd;
                var cb = document.getElementById('rememberAccountCheckbox');
                if (cb && savedId) cb.checked = true;
            } catch(e) {}
        })();

        // ===== 自动登录（直观版自动登录）=====
        // 已记住账号密码且未手动退出（oc_auto_login !== '0'）时，登录页加载后自动提交登录。
        // 手动退出登录会置 oc_auto_login='0'，之后启动停留在登录页等待手动输入。
        // 自动登录失败（429/网络错误）后：本会话内不再自动提交，避免 reload 循环持续打登录接口触发限流。
        (function autoLogin() {
            try {
                var blocked = false;
                try { blocked = !!sessionStorage.getItem('oc_auto_login_blocked'); } catch (e) {}
                if (blocked) return;
                var savedId = localStorage.getItem('savedIdentifier');
                var savedPwd = localStorage.getItem('savedPassword');
                if (savedId && savedPwd && localStorage.getItem('oc_auto_login') !== '0') {
                    var form = document.getElementById('loginForm');
                    if (form) {
                        setTimeout(function() {
                            if (form.requestSubmit) form.requestSubmit();
                            else form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
                        }, 400);
                    }
                }
            } catch (e) {}
        })();

        // ===== 登录 =====
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var id = document.getElementById('identifier').value.trim();
            var pwd = document.getElementById('password').value;
            if (!id || !pwd) return;
            var btn = this.querySelector('button[type="submit"]');
            btn.disabled = true; btn.textContent = '登录中...';
            try {
                var r = await fetch(getApiBase() + '/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'User-Agent': 'OldChatForKivotosNext' },
                    body: JSON.stringify({
                        identifier: id, password: pwd,
                        device_id: getDeviceId(), device_name: navigator.userAgent.slice(0, 120),
                        platform: 'web', app_version: 'web'
                    })
                });
                var d = await r.json();
                if (r.ok && d.access_token) {
                    localStorage.setItem('oc_access_token', d.access_token);
                    localStorage.setItem('oc_refresh_token', d.refresh_token || '');
                    localStorage.setItem('oc_user', JSON.stringify(d.user || {}));
                    // 登录成功 → 恢复自动登录（手动退出后再次手动登录即恢复）
                    try { localStorage.setItem('oc_auto_login', '1'); } catch (e) {}
                    try { sessionStorage.removeItem('oc_auto_login_blocked'); } catch (e) {}
                    var cb = document.getElementById('rememberAccountCheckbox');
                    if (cb && cb.checked) {
                        try { localStorage.setItem('savedIdentifier', id); localStorage.setItem('savedPassword', pwd); } catch(e) {}
                    } else {
                        try { localStorage.removeItem('savedIdentifier'); localStorage.removeItem('savedPassword'); } catch(e) {}
                    }
                    window.location.href = 'index.html';
                } else {
                    // 登录失败：本会话内停止自动重试（防 reload 循环持续打接口触发限流）
                    try { sessionStorage.setItem('oc_auto_login_blocked', '1'); } catch (e) {}
                    if (r.status === 429) {
                        showMsg('请求过于频繁，请稍后再试', 'error');
                    } else {
                        showMsg(d.msg || d.error || '登录失败', 'error');
                    }
                }
            } catch(err) {
                // 网络/解析错误（含 429 非 JSON 响应体）：同样停止本会话自动重试
                try { sessionStorage.setItem('oc_auto_login_blocked', '1'); } catch (e) {}
                showMsg('网络错误，请稍后再试', 'error');
            }
            btn.disabled = false; btn.textContent = '登录';
        });

        // ===== 注册：发送邮箱验证码（需先通过 GeeTest） =====
        var sendEmailCooldown = 0;
        var emailCooldownTimer = null;
        document.getElementById('reg-send-email-btn').addEventListener('click', async function() {
            var email = document.getElementById('reg-email').value.trim();
            var username = document.getElementById('reg-username').value.trim();
            if (!email) { showMsg('请输入邮箱', 'error'); return; }
            if (!username) { showMsg('请输入用户名', 'error'); return; }
            var lower = email.toLowerCase();
            if (!lower.endsWith('@qq.com') && !lower.endsWith('@vip.qq.com')) {
                showMsg('仅支持 @qq.com 或 @vip.qq.com 邮箱', 'error'); return;
            }
            // 如果没有通过人机验证，触发 GeeTest
            if (!geetestVerified || !geetestResult) {
                if (geetestCaptchaObj) {
                    geetestCaptchaObj.showCaptcha();
                } else {
                    showMsg('人机验证加载中，请稍候...', 'error');
                }
                return;
            }
            var btn = this;
            btn.disabled = true; btn.textContent = '发送中...';
            try {
                var r = await fetch(getApiBase() + '/v1/auth/email/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'User-Agent': 'OldChatForKivotosNext' },
                    body: JSON.stringify({
                        email: email,
                        geetest_lot_number: geetestResult.lot_number,
                        geetest_captcha_output: geetestResult.captcha_output,
                        geetest_pass_token: geetestResult.pass_token,
                        geetest_gen_time: geetestResult.gen_time
                    })
                });
                var d = await r.json();
                if (r.ok) {
                    showMsg('验证码已发送，10 分钟内有效', 'success');
                    sendEmailCooldown = 120;
                    emailCooldownTimer = setInterval(function() {
                        sendEmailCooldown--;
                        btn.textContent = sendEmailCooldown + 's 后重发';
                        if (sendEmailCooldown <= 0) {
                            clearInterval(emailCooldownTimer);
                            btn.disabled = false; btn.textContent = '发送验证码';
                        }
                    }, 1000);
                } else {
                    showMsg(d.msg || d.error || '发送失败', 'error');
                    btn.disabled = false; btn.textContent = '发送验证码';
                    // 验证失败，重置 GeeTest 状态
                    geetestVerified = false;
                    geetestResult = null;
                    var statusEl = document.getElementById('geetestStatus');
                    statusEl.className = 'geetest-status failed';
                    statusEl.textContent = '✗ 人机验证失效，请重新验证';
                    if (geetestCaptchaObj) geetestCaptchaObj.reset();
                }
            } catch(err) {
                console.error('[send email] error:', err);
                showMsg('发送失败：' + formatError(err), 'error');
                btn.disabled = false; btn.textContent = '发送验证码';
            }
        });

        // ===== 注册：提交注册 =====
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var email = document.getElementById('reg-email').value.trim();
            var username = document.getElementById('reg-username').value.trim();
            var password = document.getElementById('reg-password').value;
            var emailCode = document.getElementById('reg-email-code').value.trim();
            if (!email || !username || !password || !emailCode) {
                showMsg('请填写所有字段', 'error'); return;
            }
            if (password.length < 6) { showMsg('密码至少 6 位', 'error'); return; }
            var btn = this.querySelector('button[type="submit"]');
            btn.disabled = true; btn.textContent = '注册中...';
            try {
                var r = await fetch(getApiBase() + '/v1/auth/web/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'User-Agent': 'OldChatForKivotosNext' },
                    body: JSON.stringify({
                        email: email, username: username, password: password,
                        email_code: emailCode,
                        device_id: getDeviceId(), device_name: navigator.userAgent.slice(0, 120),
                        platform: 'web', app_version: '1.0.0'
                    })
                });
                var d = await r.json();
                if (r.ok && d.access_token) {
                    localStorage.setItem('oc_access_token', d.access_token);
                    localStorage.setItem('oc_refresh_token', d.refresh_token || '');
                    localStorage.setItem('oc_user', JSON.stringify(d.user || {}));
                    showMsg('注册成功，正在进入...', 'success');
                    setTimeout(function() { window.location.href = 'index.html'; }, 600);
                } else {
                    showMsg(d.msg || d.error || '注册失败', 'error');
                }
            } catch(err) {
                console.error('[register] error:', err);
                showMsg('注册失败：' + formatError(err), 'error');
            }
            btn.disabled = false; btn.textContent = '注册';
        });
    </script>
</body>
</html>
