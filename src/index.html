<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OldChat for Kivotos</title>
    <link rel="icon" href="assets/oldchat_logo.png" type="image/png">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="user-info" id="sidebarUserName" style="cursor:pointer" onclick="openMyProfile()">未登录</span>
                <button id="logoutBtn" class="icon-btn" title="退出登录"><i class="fa-solid fa-right-from-bracket"></i></button>
                <button id="themeToggleBtn" class="icon-btn" title="切换主题"><i class="fa-solid fa-circle-half-stroke"></i></button>
                <button id="pinSidebarBtn" class="icon-btn" title="取消固定"><i class="fa-solid fa-thumbtack"></i></button>
            </div>
            <div class="sidebar-tabs" id="sidebarTabs">
                <button class="tab-btn active" data-tab="chat" title="聊天"><i class="fa-solid fa-comment"></i></button>
                <button class="tab-btn" data-tab="contacts" title="联系人"><i class="fa-solid fa-user"></i></button>
                <button class="tab-btn" data-tab="music" title="音乐"><i class="fa-solid fa-music"></i></button>
                <button class="tab-btn" data-tab="settings" title="设置"><i class="fa-solid fa-gear"></i></button>
            </div>
            <div class="sidebar-panels">
                <div class="sidebar-panels-track" id="sidebarPanelsTrack">
                    <div class="sidebar-panel active" data-panel="chat">
                        <div class="contact-list" id="contactList"></div>
                    </div>
                    <div class="sidebar-panel" data-panel="contacts">
                    <div class="contacts-section">
                        <div class="contacts-section-header">
                            <span>好友申请</span>
                            <button class="icon-btn" id="addFriendBtn" title="添加好友"><i class="fa-solid fa-user-plus"></i></button>
                        </div>
                        <div id="friendRequestsList" class="contact-list"></div>
                    </div>
                    <div class="contacts-section">
                        <div class="contacts-section-header"><span>群聊</span></div>
                        <div id="contactsGroupList" class="contact-list"></div>
                    </div>
                    <div class="contacts-section">
                        <div class="contacts-section-header"><span>好友</span></div>
                        <div id="contactsFriendList" class="contact-list"></div>
                    </div>
                </div>
                    <div class="sidebar-panel" data-panel="music">
                        <div class="music-tabs" id="musicTabs">
                            <button class="music-tab-btn active" data-music-tab="plaza">广场</button>
                            <button class="music-tab-btn" data-music-tab="ranking">排行</button>
                            <button class="music-tab-btn" data-music-tab="mine">我的</button>
                        </div>
                        <div class="contact-list" id="musicList"></div>
                    </div>
                    <div class="sidebar-panel" data-panel="settings">
                        <div class="contact-list" style="padding:8px 0;">
                            <div class="contact-item active" data-settings="profile" style="cursor:pointer;"><div class="contact-info"><div class="name">我的</div></div></div>
                            <div class="contact-item" data-settings="appearance" style="cursor:pointer;"><div class="contact-info"><div class="name">界面</div></div></div>
                            <div class="contact-item" data-settings="checkin" style="cursor:pointer;"><div class="contact-info"><div class="name">签到墙</div></div></div>
                            <div class="contact-item" data-settings="about" style="cursor:pointer;"><div class="contact-info"><div class="name">关于</div></div></div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>
        <main class="chat-area">
            <div class="main-panel active" data-panel="chat">
                <div class="chat-header" id="chatHeader">
                    <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="fa-solid fa-chevron-left"></i></button>
                    <span class="chat-title">OldChat for Kivotos</span>
                    <div class="header-right">
                        <button class="header-menu-btn" id="headerMenuBtn" style="display:none;" title="群聊设置"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                        <div class="window-controls" id="windowControls">
                            <button class="win-ctrl-btn" id="winMinBtn" title="最小化"><i class="fa-solid fa-minus"></i></button>
                            <button class="win-ctrl-btn" id="winMaxBtn" title="最大化/还原"><i class="fa-regular fa-square"></i></button>
                            <button class="win-ctrl-btn" id="winCloseBtn" title="关闭"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>
                </div>
                <div class="messages" id="messagesContainer"></div>
                <div class="input-area" id="inputArea">
                    <div class="mention-popup" id="mentionPopup">
                        <input type="text" class="mention-search" id="mentionSearch" placeholder="搜索成员...">
                        <div class="mention-list" id="mentionList"></div>
                    </div>
                    <div class="quote-preview" id="quotePreview" style="display: none;">
                        <span class="quote-preview-text"></span>
                        <button id="cancelQuoteBtn" class="icon-btn" title="取消引用">✖</button>
                    </div>
                    <textarea id="messageInput" placeholder="输入消息..." rows="1"></textarea>
                    <div class="input-buttons">
                        <button id="nowPlayingBtn" class="btn" style="display:none;" title="跳转到正在播放的语音"><i class="fa-solid fa-music"></i></button>
                        <button id="sendImageBtn" class="btn">图片</button>
                        <button id="emojiPlazaBtn" class="btn">表情</button>
                        <button id="moreBtn" class="btn">更多</button>
                        <button id="sendBtn" class="btn primary">发送</button>
                    </div>
                    <div class="sync-indicator" id="syncIndicator" style="display:none;">同步中...</div>
                    <div class="more-menu" id="moreMenu">
                        <button id="sendFileBtn">上传文件</button>
                        <button id="sendUrlImageBtn">发送直链图片</button>
                        <button id="sendUrlVoiceBtn">发送直链音频</button>
                        <button id="sendBurnBtn">阅后即焚</button>
                        <button id="sendRedPacketBtn">发红包</button>
                    </div>
                    <input type="file" id="fileInput" style="display: none" multiple>
                </div>
            </div>
            <div class="main-panel" data-panel="contacts">
                <div class="chat-header">
                    <span class="chat-title">联系人</span>
                    <div class="header-right">
                        <div class="window-controls" id="contactsWinControls">
                            <button class="win-ctrl-btn" id="contactsWinMinBtn" title="最小化"><i class="fa-solid fa-minus"></i></button>
                            <button class="win-ctrl-btn" id="contactsWinMaxBtn" title="最大化/还原"><i class="fa-regular fa-square"></i></button>
                            <button class="win-ctrl-btn" id="contactsWinCloseBtn" title="关闭"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>
                </div>
                <div class="contacts-main-content" id="contactsMainContent">
                    <div class="contacts-detail-empty">
                        <i class="fa-solid fa-user-group" style="font-size:48px;color:var(--secondary-text);margin-bottom:16px;"></i>
                        <p style="color:var(--secondary-text);">从左侧选择联系人查看详情</p>
                    </div>
                </div>
            </div>
            <div class="main-panel" data-panel="music">
                <div class="music-workspace" id="musicWorkspace">
                    <div class="music-win-controls" id="musicWinControls">
                        <button class="win-ctrl-btn" id="musicWinMinBtn" title="最小化"><i class="fa-solid fa-minus"></i></button>
                        <button class="win-ctrl-btn" id="musicWinMaxBtn" title="最大化/还原"><i class="fa-regular fa-square"></i></button>
                        <button class="win-ctrl-btn" id="musicWinCloseBtn" title="关闭"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="music-empty-state">
                        <i class="fa-solid fa-music"></i>
                        <p>从左侧选择一首歌曲</p>
                    </div>
                </div>
            </div>
            <div class="main-panel" data-panel="settings">
                <div class="chat-header">
                    <span class="chat-title">设置</span>
                    <div class="header-right">
                        <div class="window-controls" id="settingsWinControls">
                            <button class="win-ctrl-btn" id="settingsWinMinBtn" title="最小化"><i class="fa-solid fa-minus"></i></button>
                            <button class="win-ctrl-btn" id="settingsWinMaxBtn" title="最大化/还原"><i class="fa-regular fa-square"></i></button>
                            <button class="win-ctrl-btn" id="settingsWinCloseBtn" title="关闭"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>
                </div>
                <div class="settings-layout">
                    <div class="settings-content" id="settingsContent"></div>
                </div>
            </div>
        </main>
    </div>
    <div class="url-input-overlay" id="urlInputOverlay" style="display:none;">
        <div class="url-input-dialog">
            <div class="url-input-title">输入图片链接</div>
            <input type="text" id="urlImageInput" placeholder="https://...">
            <div class="url-input-actions">
                <button id="urlInputCancel" class="btn">取消</button>
                <button id="urlInputSend" class="btn primary">发送</button>
            </div>
        </div>
    </div>
    <div class="url-input-overlay" id="burnDialogOverlay" style="display:none;">
        <div class="url-input-dialog" style="max-width:380px;">
            <div class="url-input-title">发送阅后即焚消息</div>
            <div style="margin-bottom:12px;">
                <label style="font-size:12px;color:var(--secondary-text);display:block;margin-bottom:4px;">焚毁时间</label>
                <select id="burnTimeSelect" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--bg);color:var(--text);font-family:inherit;outline:none;">
                    <option value="5">5 秒</option>
                    <option value="10" selected>10 秒</option>
                    <option value="30">30 秒</option>
                    <option value="60">60 秒</option>
                    <option value="300">5 分钟</option>
                </select>
            </div>
            <div style="margin-bottom:12px;">
                <label style="font-size:12px;color:var(--secondary-text);display:block;margin-bottom:4px;">消息内容</label>
                <textarea id="burnTextInput" placeholder="输入阅后即焚内容..." rows="3" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--bg);color:var(--text);font-family:inherit;outline:none;resize:vertical;box-sizing:border-box;"></textarea>
            </div>
            <div class="url-input-actions">
                <button id="burnDialogCancel" class="btn">取消</button>
                <button id="burnDialogSend" class="btn primary">发送</button>
            </div>
        </div>
    </div>
    <div class="url-input-overlay" id="redPacketDialogOverlay" style="display:none;">
        <div class="url-input-dialog" style="max-width:380px;">
            <div class="url-input-title">发送红包</div>
            <div style="margin-bottom:10px;">
                <label style="font-size:12px;color:var(--secondary-text);display:block;margin-bottom:4px;">总金额</label>
                <input type="number" id="rpAmountInput" placeholder="金额" min="0.01" step="0.01" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--bg);color:var(--text);font-family:inherit;outline:none;box-sizing:border-box;">
            </div>
            <div style="margin-bottom:10px;">
                <label style="font-size:12px;color:var(--secondary-text);display:block;margin-bottom:4px;">个数</label>
                <input type="number" id="rpCountInput" placeholder="个数" min="1" value="1" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--bg);color:var(--text);font-family:inherit;outline:none;box-sizing:border-box;">
            </div>
            <div style="margin-bottom:12px;">
                <label style="font-size:12px;color:var(--secondary-text);display:block;margin-bottom:4px;">标题</label>
                <input type="text" id="rpTitleInput" placeholder="恭喜发财" value="恭喜发财" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--bg);color:var(--text);font-family:inherit;outline:none;box-sizing:border-box;">
            </div>
            <div class="url-input-actions">
                <button id="rpDialogCancel" class="btn">取消</button>
                <button id="rpDialogSend" class="btn primary">发送</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
