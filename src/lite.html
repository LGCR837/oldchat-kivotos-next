<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>OCKNLite</title>
<link rel="icon" href="assets/oldchat_logo.png" type="image/png">
<style>
/* =====================================================================
   OCKNLite —— 手表端极简客户端
   设计约束：
   1) 不缓存 DOM：切换会话即清空渲染节点，只保留数据数组（上限 MSG_CAP 条）
   2) 纯黑白 + 直角（7 个灰阶，无彩色，除输入区收起外无动画）
   3) 单列铺满 + 安全区内边距，适配圆屏与超小分辨率
   ===================================================================== */
:root{
	color-scheme: dark;
	--row:40px;                 /* 输入区一行的高度：输入框与按钮共用，保证等高 */
	--bg:#000000;
	--panel:#0a0a0a;
	--field:#151515;
	--border:#2e2e2e;
	--text:#f2f2f2;
	--muted:#8a8a8a;
	--bubble-other:#1c1c1c;
	--bubble-self:#f2f2f2;
	--bub-text:#f2f2f2;
	--bub-text-self:#000000;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
	background:var(--bg);color:var(--text);
	font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
	-webkit-font-smoothing:antialiased;
}
#app{position:absolute;inset:0}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--muted);font-size:12px;text-align:center;padding:24px 16px}

/* ---------- 顶栏 ---------- */
.hdr{
	display:flex;align-items:center;gap:6px;flex:0 0 auto;
	min-height:42px;padding:0 10px;
	padding-top:env(safe-area-inset-top);
	background:var(--panel);border-bottom:1px solid var(--border);
}
.hdr-title{font-size:12px;font-weight:400;letter-spacing:2px;text-transform:uppercase;flex:1;min-width:0}
.hdr-btn{
	flex:0 0 auto;min-width:44px;min-height:34px;
	background:none;border:none;color:var(--text);
	font-size:12px;font-family:inherit;letter-spacing:1px;padding:6px 8px;
}
.hdr-btn:active{background:var(--field)}
.hdr-btn.back{font-size:18px;line-height:1;padding:0 4px;min-width:30px;letter-spacing:0}

/* ---------- 登录 ---------- */
#vLogin .login-box{
	flex:1;display:flex;flex-direction:column;justify-content:center;
	padding:20px 16px;padding-bottom:calc(20px + env(safe-area-inset-bottom));
}
.brand{
	font-size:13px;font-weight:400;color:var(--text);text-align:center;
	letter-spacing:4px;text-transform:uppercase;margin-bottom:14px;
}
.in{
	width:100%;min-height:44px;padding:10px 12px;display:block;
	background:var(--field);border:1px solid var(--border);border-radius:0;
	color:var(--text);font-size:15px;font-family:inherit;outline:none;
}
.in::placeholder{color:var(--muted)}
.in:focus{border-color:var(--text)}
.btn{
	width:100%;min-height:46px;border:1px solid var(--border);border-radius:0;
	font-size:14px;font-family:inherit;letter-spacing:2px;
	background:var(--field);color:var(--text);
}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn:disabled{opacity:.5}
.msg{font-size:12px;color:var(--text);text-align:center;min-height:16px;font-weight:500;margin-top:10px}

/* ---------- 会话列表 ---------- */
.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg)}
.row{
	display:flex;align-items:center;gap:10px;
	min-height:58px;padding:9px 10px;
	border-bottom:1px solid var(--border);
}
.row:active{background:var(--field)}
.row-main{flex:1;min-width:0}
.row-name{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{
	margin-top:2px;font-size:12px;color:var(--muted);
	overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.row-right{flex:0 0 auto;text-align:right;min-width:26px}
.row-time{font-size:11px;color:var(--muted)}
.badge{
	display:inline-block;margin-top:3px;min-width:18px;height:18px;
	padding:0 5px;background:var(--text);color:var(--bg);
	font-size:11px;line-height:18px;text-align:center;
}

/* ---------- 头像（直角方块，无边线）+ 首字母兜底 ---------- */
.avwrap{
	position:relative;flex:0 0 auto;overflow:hidden;
	background:var(--field);
}
.avwrap.av36{width:36px;height:36px}
.avwrap.av26{width:26px;height:26px}
.av{width:100%;height:100%;object-fit:cover;display:block}
.mono{
	position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
	font-size:14px;color:var(--muted);font-family:inherit;
}
.avwrap.av26 .mono{font-size:11px}

/* ---------- 聊天 ---------- */
.msgs{
	flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
	display:flex;flex-direction:column;gap:8px;
	padding:10px;padding-bottom:6px;
}
/* 头像与昵称顶部对齐（顶部对齐 → 头像顶端对准昵称顶端） */
.m{display:flex;gap:7px;align-items:flex-start;max-width:100%}
.m.self{flex-direction:row-reverse}
.mcol{display:flex;flex-direction:column;min-width:0;max-width:80%}
.m.self .mcol{align-items:flex-end}
.mname{font-size:11px;color:var(--muted);margin:0 2px 2px;line-height:15px}
.avwrap.av26{margin-top:-1px}   /* 视觉微调：让方块顶端与 11px 昵称的视觉基线对齐 */
.bub{
	padding:7px 10px;border-radius:0;
	background:var(--bubble-other);color:var(--bub-text);
	font-size:14px;word-break:break-word;white-space:pre-wrap;
}
.m.self .bub{background:var(--bubble-self);color:var(--bub-text-self)}
.ph{opacity:.7}
.mimg{display:block;max-width:100%;max-height:200px}
/* 引用块：单色描边，不抢正文 */
.quote-block{
	border-left:2px solid currentColor;padding:3px 0 3px 7px;margin-bottom:5px;
	font-size:12px;opacity:.72;word-break:break-word;white-space:pre-wrap;
}
.quote-sender{font-weight:500;margin-bottom:1px}
/* 引用跳转后短暂描边标记（非动画，1.2s 后移除） */
.m.hl .bub{outline:1px solid var(--text);outline-offset:1px}

/* ---------- 输入区（含引用条；收起时带动画）---------- */
.composer{
	flex:0 0 auto;display:flex;flex-direction:column;gap:6px;
	padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));
	background:var(--panel);border-top:1px solid var(--border);
	max-height:160px;overflow:hidden;
	transition:max-height .18s ease,opacity .18s ease,padding .18s ease,border-top-width .18s ease;
}
.composer.hide{
	max-height:0;opacity:0;
	padding-top:0;padding-bottom:0;border-top-width:0;
}
.crow{display:flex;align-items:center;gap:6px}
/* 输入框与两个按钮共用 --row，保证严格等高 */
.composer-in{flex:1;min-width:0;height:var(--row);min-height:0;padding:0 10px;font-size:14px}
.cbtn{
	flex:0 0 auto;width:var(--row);height:var(--row);padding:0;
	display:flex;align-items:center;justify-content:center;
	background:var(--field);border:1px solid var(--border);border-radius:0;
	color:var(--text);font-size:18px;font-family:inherit;line-height:1;
}
.cbtn:active{opacity:.65}
.cbtn.send{background:var(--text);border-color:var(--text);color:var(--bg)}
.cbtn:disabled{opacity:.45}
.qbar{display:none;align-items:center;gap:6px;border-left:2px solid var(--text);padding-left:7px}
.qbar.on{display:flex}
.qbar-text{flex:1;min-width:0;font-size:11px;color:var(--muted)}
.qbar-x{
	flex:0 0 auto;width:26px;height:26px;padding:0;
	background:none;border:1px solid var(--border);border-radius:0;
	color:var(--text);font-size:14px;font-family:inherit;line-height:1;
}

/* ---------- 轻提示 ---------- */
#toast{
	position:absolute;left:14px;right:14px;bottom:calc(68px + env(safe-area-inset-bottom));
	background:var(--bg);color:var(--text);font-size:12px;
	padding:9px 12px;border:1px solid var(--text);border-radius:0;
	text-align:center;display:none;z-index:50;
}
#toast.on{display:block}

/* ---------- 超小屏 / 横向小高度适配 ---------- */
@media (max-width:240px){
	:root{--row:36px}
	.hdr{min-height:36px;padding:0 6px}
	.hdr-title{font-size:11px;letter-spacing:1.5px}
	.row{min-height:52px;padding:7px 8px;gap:8px}
	.avwrap.av36{width:30px;height:30px}
	.avwrap.av36 .mono{font-size:12px}
	.row-name{font-size:13px}
	.row-sub{font-size:11px}
	.composer{gap:4px;padding:6px 5px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
	.composer-in{font-size:13px;padding:0 8px}
	.bub{font-size:13px;padding:6px 8px}
	.mcol{max-width:84%}
	.brand{letter-spacing:2px}
}
@media (max-height:240px){
	.hdr{min-height:32px}
	.msgs{padding:6px;gap:5px}
	#vLogin .login-box{padding:12px 14px}
	.brand{margin-bottom:6px}
}
</style>
</head>
<body>
<div id="app">

	<!-- ========== 登录 ========== -->
	<section id="vLogin" class="view">
		<div class="login-box">
			<div class="brand">OCKNLite</div>
			<form id="loginForm" autocomplete="on">
				<input id="inId" class="in" type="text" placeholder="账号 / 邮箱 / UID"
					autocomplete="username" autocapitalize="off" autocorrect="off" enterkeyhint="next" required>
				<input id="inPwd" class="in" type="password" placeholder="密码"
					autocomplete="current-password" enterkeyhint="go" required style="margin-top:8px">
				<button id="btnLogin" class="btn primary" type="submit" style="margin-top:12px">登录</button>
			</form>
			<div id="loginMsg" class="msg"></div>
		</div>
	</section>

	<!-- ========== 会话列表 ========== -->
	<section id="vList" class="view">
		<header class="hdr">
			<span class="hdr-title">OCKNLite</span>
			<button id="btnLogout" class="hdr-btn">登出</button>
		</header>
		<div id="convList" class="list"></div>
	</section>

	<!-- ========== 聊天 ========== -->
	<section id="vChat" class="view">
		<header class="hdr">
			<button id="btnBack" class="hdr-btn back" aria-label="返回">&#8249;</button>
			<span id="chatTitle" class="hdr-title ellipsis"></span>
		</header>
		<div id="msgList" class="msgs"></div>
		<div id="composer" class="composer">
			<div id="qbar" class="qbar">
				<div id="qbarText" class="qbar-text ellipsis"></div>
				<button id="qbarX" class="qbar-x" aria-label="取消引用">&#215;</button>
			</div>
			<div class="crow">
				<input id="inMsg" class="in composer-in" type="text" placeholder="发消息" enterkeyhint="send">
				<button id="btnPlus" class="cbtn" aria-label="发送图片">+</button>
				<button id="btnSend" class="cbtn send" aria-label="发送">&#62;</button>
			</div>
		</div>
	</section>

	<div id="toast"></div>
</div>
<input id="filePick" type="file" accept="image/*" hidden>

<script src="oldchat-api-sdk-javascript/oldchat-api-sdk.js"></script>
<script src="oldchat-api-sdk-javascript/oldchat-ws-extension.js"></script>
<script>
(function () {
'use strict';

/* =====================================================================
   0. 配置
   ===================================================================== */
var PROXY      = 'proxy.php';   // 与 lite.html 同级；接口一律经同源代理，绕开 CORS / 混合内容
var MSG_CAP    = 30;            // 当前会话最多保留的消息条数（不驻留其它会话）
var AVA_PX     = 96;            // 头像请求尺寸（表上只显示 26~36px，按 3x 取 96）
var FALLBACK60 = 'http://60.205.94.101:8080';   // 旧主服务器：OSS 缺失的老头像可能只在这里
var POLL_LIST  = 25000;
var POLL_CHAT  = 15000;
var POLL_SAFE  = 60000;          // WS 在线时的「兜底轮询」：仅作安全网，间隔拉长到 1 分钟
var KEEPALIVE  = 5 * 60 * 1000; // 主动续期间隔（避免 token 过期后撞上 SDK 的 401 登出流程）
var LS_TOKEN   = 'oc_access_token';
var LS_USER    = 'oc_user';
var LS_CONVS   = 'oc_lite_convs';

/* =====================================================================
   1. 传输层：ocTransport 必须在 SDK 加载之后注入
      （SDK 内有同名 wrapper，先注入会被覆盖 → 自递归）
   ===================================================================== */
// ★ 关键：SDK 的 _fetchWithCandidates 与 token 刷新都会直接传【绝对 URL】
//   （base + '/v1/...'），因此协议归一化必须做在 ocTransport 里，
//   只改相对路径补全是不够的 —— 否则 http://oc… 会原样发出：
//   · API 返回 401 unauthorized
//   · /v1/auth/refresh 同样被拒 → SDK 清 token 并跳 login.html
function normProto(u) {
	var s = String(u || '');
	if (location.protocol !== 'https:') return s;
	if (s.indexOf('http://') !== 0) return s;
	// 60.205 无 TLS：保持 http，由代理转发（同源，不构成混合内容）
	if (s.indexOf(FALLBACK60) === 0) return s;
	return 'https://' + s.slice(7);
}
function baseOrigin() {
	var b = 'https://oc.mcl0.dpdns.org';
	try {
		if (typeof BACKEND_CANDIDATES !== 'undefined' && BACKEND_CANDIDATES && BACKEND_CANDIDATES[0]) {
			b = String(BACKEND_CANDIDATES[0]);
		}
	} catch (e) {}
	if (b.indexOf('//') === 0) b = 'https:' + b;
	return normProto(b).replace(/\/+$/, '');
}
function absApi(u) {
	var s = String(u || '');
	if (/^https?:\/\//i.test(s)) return normProto(s);
	return baseOrigin() + (s.charAt(0) === '/' ? '' : '/') + s;
}
// 媒体（图片/头像/频道媒体/文件下载）默认直连，不走代理。
function isMediaPath(p) {
	return p.indexOf('/v1/uploads/') === 0 || p.indexOf('/v2/uploads/') === 0 ||
	       p.indexOf('/channel-media/') === 0 || p.indexOf('/v2/files/download') === 0;
}
window.ocTransport = function (url, init) {
	var s = normProto(url);
	var p = '';
	try { p = new URL(String(s), location.href).pathname || ''; } catch (e) {}
	if (isMediaPath(p)) return fetch(s, init);
	return fetch(PROXY + '?u=' + encodeURIComponent(absApi(s)), init);
};

/* =====================================================================
   2. v2 会话（ECDH P-256）
      实现在此重写一份，不改共享 SDK —— SDK 只消费 window.__httpSession。
      HTTP 专用会话，与 WS 会话严格隔离；握手走 /v1/auth/handshake（非 /v2/），
      v2SignHeaders 立即返回 {}，因此不会与签名流程递归。
   ===================================================================== */
var sId = null, sEnc = null, sMac = null, sPending = null;

function ensureSession() {
	if (sId && sEnc && sMac) return Promise.resolve();
	if (sPending) return sPending;
	sPending = (async function () {
		if (sId && sEnc && sMac) return;
		if (!window.crypto || !crypto.subtle) throw new Error('需要 HTTPS：当前环境无 WebCrypto');
		var keys = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveBits']);
		var spki = await crypto.subtle.exportKey('spki', keys.publicKey);
		var r = await apiFetch('/v1/auth/handshake', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ client_pub: Crypto.bytesToBase64(new Uint8Array(spki)) })
		});
		var d = await r.json();
		if (d.error) throw new Error(d.error);
		var srv = await crypto.subtle.importKey(
			'spki', Crypto.base64ToBytes(d.server_pub), { name: 'ECDH', namedCurve: 'P-256' }, false, []
		);
		var secret = new Uint8Array(
			await crypto.subtle.deriveBits({ name: 'ECDH', public: srv }, keys.privateKey, 256)
		);
		sEnc = await Crypto.sha256(Crypto.concatBytes(secret, new TextEncoder().encode('enc')));
		sMac = await Crypto.sha256(Crypto.concatBytes(secret, new TextEncoder().encode('mac')));
		sId  = d.session_id;
	})().finally(function () { sPending = null; });
	return sPending;
}
function resetSession() { sId = null; sEnc = null; sMac = null; }
window.__httpSession = {
	ensure: ensureSession,
	getMacKey: function () { return sMac; },
	getEncKey: function () { return sEnc; },
	getSessionId: function () { return sId; },
	clear: resetSession
};

// ★ WS 专用 ECDH 会话（与 HTTP 的 __httpSession 严格隔离）：
//   oldchat-ws-extension.js 的 defaultGetUrl() 从 window.__wsSession.getSessionId() 取 sid 拼到
//   wss URL 的 ?sid= 参数；其自带 defaultHandshake 只把会话存到内部 this._session，并不回填
//   window.__wsSession → 若不在此显式定义，WS 会以【空 sid】建连被服务端拒。
//   因此这里重写一份独立握手（复用 Crypto/apiFetch），并挂到 window.__wsSession 供扩展包读取。
var wsSId = null, wsSEnc = null, wsSMac = null, wsSPending = null;
function ensureWsSession() {
	if (wsSId && wsSEnc && wsSMac) return Promise.resolve();
	if (wsSPending) return wsSPending;
	wsSPending = (async function () {
		if (wsSId && wsSEnc && wsSMac) return;
		if (!window.crypto || !crypto.subtle) throw new Error('需要 HTTPS：当前环境无 WebCrypto');
		var keys = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveBits']);
		var spki = await crypto.subtle.exportKey('spki', keys.publicKey);
		var r = await apiFetch('/v1/auth/handshake', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ client_pub: Crypto.bytesToBase64(new Uint8Array(spki)) })
		});
		var d = await r.json();
		if (d.error) throw new Error(d.error);
		var srv = await crypto.subtle.importKey(
			'spki', Crypto.base64ToBytes(d.server_pub), { name: 'ECDH', namedCurve: 'P-256' }, false, []
		);
		var secret = new Uint8Array(
			await crypto.subtle.deriveBits({ name: 'ECDH', public: srv }, keys.privateKey, 256)
		);
		wsSEnc = await Crypto.sha256(Crypto.concatBytes(secret, new TextEncoder().encode('enc')));
		wsSMac = await Crypto.sha256(Crypto.concatBytes(secret, new TextEncoder().encode('mac')));
		wsSId  = d.session_id;
	})().finally(function () { wsSPending = null; });
	return wsSPending;
}
function resetWsSession() { wsSId = null; wsSEnc = null; wsSMac = null; }
window.__wsSession = {
	ensure: ensureWsSession,
	getSessionId: function () { return wsSId; },
	getEncKey: function () { return wsSEnc; },
	getMacKey: function () { return wsSMac; },
	clear: resetWsSession
};

/* =====================================================================
   3. 状态：只放数据，不放 DOM
   ===================================================================== */
var S = {
	me: null,
	convs: [],
	cur: null,
	msgs: [],
	members: {},   // 当前会话成员表：uid/ncuid → {name, avatar}（仅当前会话）
	quote: null,   // 待发送的引用
	sig: '',
	convSig: '',
	timer: null,
	keepTimer: null,
	ws: null,      // OCWebSocket 实例（实时推送，HTTP 轮询降级为兜底）
	wsLive: false, // WS 是否已连上：连上即停短轮询，仅留 1 分钟安全网
	wsConvRefresh: false // WS 推来一个未知会话时，置位待列表刷新
};

/* =====================================================================
   4. 工具
   ===================================================================== */
function $(id) { return document.getElementById(id); }
function esc(s) {
	return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
		return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
	});
}
function show(id) {
	['vLogin', 'vList', 'vChat'].forEach(function (v) { $(v).classList.toggle('on', v === id); });
}
var toastTimer = null;
function toast(text) {
	var el = $('toast');
	if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
	if (!text) { el.classList.remove('on'); return; }
	el.textContent = text;
	el.classList.add('on');
	toastTimer = setTimeout(function () { el.classList.remove('on'); }, 2600);
}
// 解析消息 body：兼容纯文本与 v2 JSON（{v:2,text,quote,mentions}）
function parseBody(b) {
	if (typeof b !== 'string') return { text: b == null ? '' : String(b), quote: null };
	if (b.charAt(0) !== '{') return { text: b, quote: null };
	try {
		var o = JSON.parse(b);
		if (o && o.v === 2) {
			return { text: typeof o.text === 'string' ? o.text : '', quote: o.quote || null };
		}
	} catch (e) {}
	return { text: b, quote: null };
}
function bodyText(b) { return parseBody(b).text; }
// 引用文本本身也可能是 v2 JSON（图片消息的引用等），再解一层
function quoteText(q) {
	if (!q) return '';
	return parseBody(q.text).text || '';
}
function phLabel(t) {
	switch (t) {
		case 'image':      return '[图片]';
		case 'voice':
		case 'audio':      return '[语音]';
		case 'video':      return '[视频]';
		case 'file':       return '[文件]';
		case 'red_packet': return '[红包]';
		case 'sticker':    return '[表情]';
		default:           return '[消息]';
	}
}
function hhmm(ts) {
	var n = Number(ts) || 0;
	if (!n) return '';
	var d = new Date(n * 1000), now = new Date();
	var p = function (x) { return (x < 10 ? '0' : '') + x; };
	if (d.toDateString() === now.toDateString()) return p(d.getHours()) + ':' + p(d.getMinutes());
	return (d.getMonth() + 1) + '/' + d.getDate();
}
// 判断推送消息是否发自本人（ncuid 优先，回显时跳过，避免与乐观上屏重复）
function isSelfId(ncuid, uid) {
	var me = S.me || {};
	var up = function (s) { return String(s || '').toUpperCase(); };
	return (me.ncuid && ncuid && up(me.ncuid) === up(ncuid)) ||
	       (me.uid && uid && up(me.uid) === up(uid));
}

/* ---- 媒体 / 头像 URL ---- */
function uploadPathOf(u) {
	var s = String(u || '');
	if (!s) return '';
	var i = s.indexOf('/v1/uploads/');
	if (i >= 0) return s.slice(i + '/v1/uploads/'.length).split('?')[0];
	var m = s.match(/^https?:\/\/[^/]+\/(.+)$/);
	return m ? m[1].split('?')[0] : '';
}
// OSS 地址 + 强制缩放参数。
// 必须自己加：SDK 只对 avatars/ 路径加参数，而群头像存在 /v1/uploads/media/ 下，
// 于是群头像会按原图下载（实测 153KB~325KB，表上等于卡死）。
function ossUrl(u, px) {
	var base;
	try { base = resolveMediaUrl(u); } catch (e) { base = u || ''; }
	if (!base) return '';
	if (base.indexOf('ocf.oss-cn-shanghai.aliyuncs.com') === -1) return base;
	var q = 'x-oss-process=image/resize,w_' + px + ',h_' + px + ',m_fill/quality,Q_80';
	if (base.indexOf('x-oss-process=') !== -1) return base.replace(/x-oss-process=[^&]*/, q);
	return base + (base.indexOf('?') === -1 ? '?' : '&') + q;
}
// 头像候选链：OSS（全量）→ 60.205（经代理，避免 https 下被混合内容拦死）
function avCandidates(u) {
	var out = [];
	var o = ossUrl(u, AVA_PX);
	if (o) out.push(o);
	var p = uploadPathOf(u);
	if (p) out.push(PROXY + '?u=' + encodeURIComponent(FALLBACK60 + '/v1/uploads/' + p));
	return out;
}
function avHtml(u, name, sizeClass) {
	var cands = avCandidates(u);
	var mono = String(name == null ? '' : name).trim().slice(0, 1) || '?';
	var inner = cands.length
		? '<img class="av" alt="" loading="lazy" decoding="async" data-i="0" data-cands="' + esc(cands.join('|')) +
		  '" data-mono="' + esc(mono) + '" src="' + esc(cands[0]) + '" onerror="__avErr(this)">'
		: '<span class="mono">' + esc(mono) + '</span>';
	return '<span class="avwrap ' + sizeClass + '">' + inner + '</span>';
}
// 头像加载失败：依次试下一个候选；全部失败退回首字母方块
window.__avErr = function (img) {
	var list = String(img.getAttribute('data-cands') || '').split('|');
	var i = (parseInt(img.getAttribute('data-i'), 10) || 0) + 1;
	if (i < list.length && list[i]) {
		img.setAttribute('data-i', String(i));
		img.src = list[i];
		return;
	}
	var wrap = img.parentNode;
	if (!wrap) return;
	var mono = document.createElement('span');
	mono.className = 'mono';
	mono.textContent = img.getAttribute('data-mono') || '?';
	wrap.replaceChild(mono, img);
};
// 消息里的图片：不走候选链（避免大图占服务器流量），失败退化为 [图片]
function msgImageUrl(u) {
	try { return cachedResolveMediaUrl(u, { thumb: true }); } catch (e) { return u || ''; }
}
window.__imgErr = function (img) {
	var s = document.createElement('span');
	s.className = 'ph';
	s.textContent = '[图片]';
	if (img.parentNode) img.parentNode.replaceChild(s, img);
};

function getDeviceId() {
	var k = 'oldchat_device_id', v = null;
	try { v = localStorage.getItem(k); } catch (e) {}
	if (!v) {
		v = 'lite-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
		try { localStorage.setItem(k, v); } catch (e) {}
	}
	return v;
}

/* =====================================================================
   5. 登录 / 登出
   ===================================================================== */
async function doLogin() {
	var id = $('inId').value.trim();
	var pwd = $('inPwd').value;
	if (!id || !pwd) { $('loginMsg').textContent = '请输入账号和密码'; return; }
	var btn = $('btnLogin');
	btn.disabled = true; btn.textContent = '登录中…';
	$('loginMsg').textContent = '';
	try {
		var r = await apiFetch('/v1/auth/login', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({
				identifier: id, password: pwd,
				device_id: getDeviceId(), device_name: 'OCKNLite',
				platform: 'web', app_version: 'lite'
			})
		});
		var d = await r.json();
		if (!r.ok || !d.access_token) {
			throw new Error(d.msg || d.error || ('登录失败 (' + r.status + ')'));
		}
		try {
			localStorage.setItem(LS_TOKEN, d.access_token);
			localStorage.setItem('oc_refresh_token', d.refresh_token || '');
			localStorage.setItem(LS_USER, JSON.stringify(d.user || {}));
		} catch (e) {}
		S.me = d.user || {};
		authFailing = false;        // 登录成功，解除鉴权失效锁定，允许下次过期再触发
		$('inPwd').value = '';
		await loadMe();
		openList(true);
		keepAlive(true);
		initWs();               // 登录后立即建 WS 实时通道（失败自动降级轮询）
	} catch (e) {
		$('loginMsg').textContent = e && e.message ? e.message : '网络错误';
	} finally {
		btn.disabled = false; btn.textContent = '登录';
	}
}

function logout() {
	stopPoll();
	stopKeepAlive();
	if (S.ws) { try { S.ws.disconnect(); } catch (e) {} S.ws = null; }
	S.wsLive = false;
	resetSession();
	resetWsSession();      // WS 会话随登录态失效，清掉避免下次握手用旧 sid
	try {
		localStorage.removeItem(LS_TOKEN);
		localStorage.removeItem('oc_refresh_token');
		localStorage.removeItem(LS_USER);
		localStorage.removeItem(LS_CONVS);
	} catch (e) {}
	S.me = null; S.convs = []; S.cur = null; S.msgs = []; S.members = {};
	S.quote = null; S.sig = ''; S.convSig = '';
	hideQuoteBar();
	$('convList').innerHTML = '';
	$('msgList').innerHTML = '';
	$('inMsg').value = '';
	$('loginMsg').textContent = '';
	show('vLogin');
}

async function loadMe() {
	try {
		var u = await OC.getMe();
		if (u && (u.ncuid || u.uid)) {
			S.me = Object.assign({}, S.me || {}, u);
			try { localStorage.setItem(LS_USER, JSON.stringify(S.me)); } catch (e) {}
		}
	} catch (e) {}
}

function isAuthError(e) {
	var s = '';
	try {
		s = String((e && e.message) || '') + ' ' + String((e && e.code) || '') + ' ' + String((e && e.raw) || '');
	} catch (x) {}
	return /401|403|unauthorized|missing_session|invalid_token|token_expired|OC_AUTH_EXPIRED|登录已失效/i.test(s);
}

/* =====================================================================
   6. token 主动续期
      早期 SDK 在「刷新失败」时会直接 window.location.href = 'login.html'，
      但 login.html 属于各消费端自有 UI，不应出现在协议层 SDK 中（已在
      oldchat-api-sdk.js 修复：改为派发 oc:auth-fail 事件 + 可选回调
      window.__ocOnAuthFail，并抛出 OC_AUTH_EXPIRED）。
      这里仍用【原生 fetch】走代理刷新（不经过 apiFetch），避免启动期
      带着过期 token 打业务接口触发 SDK 的刷新/登出流程。
   ===================================================================== */
var keepAt = 0;
// 返回 true=续期成功或无需续期；false=刷新失败（token 已死，调用方应回登录页）
async function keepAlive(force) {
	if (!force && Date.now() - keepAt < KEEPALIVE) return true;
	var rt = null;
	try { rt = localStorage.getItem('oc_refresh_token'); } catch (e) {}
	if (!rt) return true;   // 无刷新 token：无法主动续期，交由数据请求自行验证
	keepAt = Date.now();
	try {
		var r = await fetch(PROXY + '?u=' + encodeURIComponent(baseOrigin() + '/v1/auth/refresh'), {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ refresh_token: rt })
		});
		if (!r.ok) return false;                 // 刷新失败：token 已失效，调用方应回登录页
		var d = await r.json();
		if (!d || !d.access_token) return false;
		try {
			localStorage.setItem(LS_TOKEN, d.access_token);
			if (d.refresh_token) localStorage.setItem('oc_refresh_token', d.refresh_token);
			if (d.user) localStorage.setItem(LS_USER, JSON.stringify(d.user));
		} catch (e) {}
		resetSession();                          // token 变了，ECDH 会话重握一次
		return true;
	} catch (e) { return false; }
}
function startKeepAlive() {
	stopKeepAlive();
	S.keepTimer = setInterval(function () { if (!document.hidden) keepAlive(); }, KEEPALIVE);
}
function stopKeepAlive() {
	if (S.keepTimer) { clearInterval(S.keepTimer); S.keepTimer = null; }
}

// 鉴权失败 → 一次性判定失效，直接回内联登录页。
// 为什么不重试：能走到这里说明 SDK 内部已经把 v2→v1→refresh→重试 全跑完了
// （refresh 成功就会直接返回成功响应，不会抛到我们这层）。所以一次 401 即为确诊，
// 再重试只会延长必然失败、并制造「拼命报错」的刷屏。
// 触发源可能同时到达（SDK 的回调 + oc:auth-fail 事件），用 authFailing 防重。
var authFailing = false;
function onAuthFail() {
	if (authFailing) return;
	authFailing = true;
	toast('登录已失效，请重新登录');
	logout();
}
// [Fix B] SDK 鉴权彻底失败时不再强跳 login.html，改为派发 oc:auth-fail 事件。
// 这里监听并路由到自带内联登录页（onAuthFail 内部已防重触发）。
window.addEventListener('oc:auth-fail', function () { onAuthFail(); });

/* =====================================================================
   7. 会话列表
   ===================================================================== */
function saveConvCache() {
	try {
		localStorage.setItem(LS_CONVS, JSON.stringify({
			t: Date.now(),
			list: S.convs.map(function (c) {
				return { type: c.type, id: c.id, key: c.key, name: c.name, avatar: c.avatar,
				         unread: c.unread, last: c.last, toUid: c.toUid, ncuid: c.ncuid };
			})
		}));
	} catch (e) {}
}
function loadConvCache() {
	try {
		var o = JSON.parse(localStorage.getItem(LS_CONVS) || 'null');
		if (o && o.list && o.list.length) { S.convs = o.list; renderConvs(); return true; }
	} catch (e) {}
	return false;
}

// 数据未变则不重建列表 —— 重建会把所有 <img> 换掉，在表上会造成肉眼可见的重载闪烁
function renderConvs() {
	var box = $('convList');
	if (!S.convs.length) {
		if (S.convSig !== '(empty)') { S.convSig = '(empty)'; box.innerHTML = '<div class="empty">暂无会话</div>'; }
		return;
	}
	var sig = S.convs.map(function (c) {
		return c.key + ',' + c.unread + ',' + ((c.last && c.last.ts) || 0) + ',' + esc(c.name) + ',' + esc(c.avatar || '');
	}).join('|');
	if (sig === S.convSig && box.childNodes.length) return;
	S.convSig = sig;

	var h = [];
	for (var i = 0; i < S.convs.length; i++) {
		var c = S.convs[i];
		h.push('<div class="row" data-key="' + esc(c.key) + '">');
		h.push(avHtml(c.avatar, c.name, 'av36'));
		h.push('<div class="row-main"><div class="row-name">' + esc(c.name) + '</div>');
		if (c.last && c.last.text) {
			h.push('<div class="row-sub">' + esc(String(c.last.text).slice(0, 60)) + '</div>');
		}
		h.push('</div><div class="row-right">');
		if (c.last && c.last.ts) h.push('<div class="row-time">' + esc(hhmm(c.last.ts)) + '</div>');
		if (c.unread) h.push('<div class="badge">' + (c.unread > 99 ? '99+' : c.unread) + '</div>');
		h.push('</div></div>');
	}
	box.innerHTML = h.join('');
}

async function loadConvs() {
	var res;
	try {
		res = await Promise.all([
			OC.getGroups(),
			OC.getFriends(),
			OC.getUnreadGroups(100).catch(function () { return []; }),
			OC.getUnreadDirect(100).catch(function () { return []; })
		]);
	} catch (e) {
		if (isAuthError(e)) { onAuthFail(); return; }
		if (!S.convs.length) $('convList').innerHTML = '<div class="empty">加载失败：' + esc(e.message || '') + '</div>';
		return;
	}
	var groups = res[0] || [], friends = res[1] || [], ug = res[2] || [], ud = res[3] || [];
	var map = {};

	groups.forEach(function (g) {
		var id = String(g.id || '');
		if (!id) return;
		map['group:' + id] = { type: 'group', id: id, key: 'group:' + id,
			name: g.name || id, avatar: g.avatar || '', unread: 0, last: null };
	});
	friends.forEach(function (f) {
		var id = f.ncuid || f.uid || '';
		if (!id) return;
		map['direct:' + id] = { type: 'direct', id: id, key: 'direct:' + id,
			name: f.name || id, avatar: f.avatar || '', unread: 0, last: null,
			toUid: f.rawUid || f.uid || '', ncuid: f.ncuid || '' };
	});

	function bump(c, m) {
		c.unread++;
		var ts = Number(m.created_at) || 0;
		if (!c.last || ts > c.last.ts) c.last = { ts: ts, text: bodyText(m.body) || phLabel(m.msg_type) };
	}
	ug.forEach(function (m) {
		var c = m.group_id ? map['group:' + m.group_id] : null;
		if (c) bump(c, m);
	});
	ud.forEach(function (m) {
		var k = m.from_ncuid || m.from_uid || '';
		var c = k ? map['direct:' + k] : null;
		if (c) bump(c, m);
	});

	S.convs = Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) {
		if (!!b.unread !== !!a.unread) return (b.unread ? 1 : 0) - (a.unread ? 1 : 0);
		return ((b.last && b.last.ts) || 0) - ((a.last && a.last.ts) || 0);
	});
	saveConvCache();
	renderConvs();
}

function openList(refresh) {
	show('vList');
	renderConvs();
	if (refresh || !S.convs.length) loadConvs();
	restartPoll();
}

/* =====================================================================
   8. 聊天
   ===================================================================== */
function findConv(key) {
	for (var i = 0; i < S.convs.length; i++) if (S.convs[i].key === key) return S.convs[i];
	return null;
}

// 消息里的 from_avatar 实测为 undefined，昵称也可能为空 →
// 必须靠成员表补上头像与名字（仅当前会话，切走即丢）
async function loadMembers(c) {
	S.members = {};
	if (c.type === 'direct') {
		S.members[c.id] = { name: c.name, avatar: c.avatar };
		if (c.toUid) S.members[c.toUid] = S.members[c.id];
		return;
	}
	try {
		var list = await OC.getGroupMembers(c.id);
		(list || []).forEach(function (m) {
			var rec = { name: m.name || m.uid || '', avatar: m.avatar || '' };
			if (m.uid) S.members[m.uid] = rec;
			if (m.ncuid) S.members[m.ncuid] = rec;
			if (m.rawUid) S.members[m.rawUid] = rec;
		});
	} catch (e) {}
}

async function openChat(key) {
	var c = findConv(key);
	if (!c) return;
	S.cur = c;
	S.msgs = []; S.members = {}; S.sig = ''; S.quote = null;
	msgTop = 0;
	hideQuoteBar();
	showComposer(true);
	$('chatTitle').textContent = c.name;
	$('msgList').innerHTML = '<div class="empty">加载中…</div>';
	show('vChat');
	await Promise.all([loadMembers(c), loadMsgs(true)]);
	markRead();
	restartPoll();
}

function msgSig() {
	var n = S.msgs.length;
	return n + '|' + (n ? (S.msgs[n - 1].id || '') : '');
}

async function loadMsgs(initial) {
	if (!S.cur) return;
	var c = S.cur;
	try {
		var raw = c.type === 'group'
			? await OC.getGroupMessages(c.id, { limit: MSG_CAP, offset: 0 })
			: await OC.getDirectMessages(c.id, { limit: MSG_CAP, offset: 0 });
		// 接口返回「新 → 旧」，转升序；再截断，只留最近 MSG_CAP 条
		S.msgs = (raw || []).slice().reverse().slice(-MSG_CAP);
		var sig = msgSig();
		if (sig !== S.sig) { S.sig = sig; renderMsgs(); }
	} catch (e) {
		if (isAuthError(e)) { onAuthFail(); return; }
		if (initial) $('msgList').innerHTML = '<div class="empty">加载失败：' + esc(e.message || '') + '</div>';
	}
}

// 引用块（点击可跳转到被引用的消息）
function quoteHtml(q) {
	if (!q) return '';
	var who = q.from_name || q.from_ncuid || q.from_uid || '';
	return '<div class="quote-block" data-quoted-id="' + esc(q.id || '') + '">' +
	       '<div class="quote-sender">' + esc(who) + '</div>' +
	       '<div>' + esc(quoteText(q)) + '</div></div>';
}

function renderMsgs() {
	var box = $('msgList');
	if (!S.msgs.length) { box.innerHTML = '<div class="empty">还没有消息</div>'; return; }
	var me = S.me || {};
	var meIds = [me.ncuid || '', me.uid || ''].filter(Boolean);
	var h = [], prevUid = null;
	for (var i = 0; i < S.msgs.length; i++) {
		var m = S.msgs[i];
		var uid = m.from_ncuid || m.from_uid || '';
		var self = meIds.indexOf(uid) >= 0;
		var info = S.members[uid] || {};
		var name = m.from_name || info.name || uid;
		var avatar = m.from_avatar || info.avatar || '';
		var t = m.msg_type || 'text';
		var parsed = parseBody(m.body);
		var inner;
		if (t === 'text') {
			inner = quoteHtml(parsed.quote) + esc(parsed.text);
		} else if (t === 'image' && (m.media_url || m.body)) {
			inner = quoteHtml(parsed.quote) +
			        '<img class="mimg" alt="" loading="lazy" onerror="__imgErr(this)" src="' +
			        esc(msgImageUrl(m.thumb_url || m.media_url || m.body)) + '">';
		} else {
			inner = quoteHtml(parsed.quote) + '<span class="ph">' + esc(phLabel(t)) + '</span>';
		}
		var newSender = !self && uid !== prevUid;
		h.push('<div class="m' + (self ? ' self' : '') + '" data-msg-id="' + esc(m.id || '') + '">');
		if (!self) {
			h.push(newSender ? avHtml(avatar, name, 'av26')
			                 : '<span class="avwrap av26" style="visibility:hidden"></span>');
		}
		h.push('<div class="mcol">');
		if (newSender) h.push('<div class="mname">' + esc(name) + '</div>');
		h.push('<div class="bub">' + inner + '</div></div></div>');
		prevUid = uid;
	}
	box.innerHTML = h.join('');
	box.scrollTop = box.scrollHeight;
	msgTop = box.scrollTop;
	showComposer(true);
}

function markRead() {
	if (!S.cur) return;
	var c = S.cur;
	c.unread = 0;
	try {
		var p = c.type === 'group' ? OC.markGroupRead(c.id) : OC.markDirectRead(c.id);
		if (p && p.catch) p.catch(function () {});
	} catch (e) {}
}

/* ---- 引用：设置 / 取消 / 展示 ---- */
function setQuote(m) {
	if (!m) return;
	var parsed = parseBody(m.body);
	var txt = (parsed.text || phLabel(m.msg_type)).slice(0, 200);
	S.quote = {
		id: m.id || '',
		from_uid: m.from_uid || '',
		from_ncuid: m.from_ncuid || '',
		from_name: m.from_name || (S.members[m.from_ncuid || m.from_uid] || {}).name || '',
		type: m.msg_type || 'text',
		text: txt
	};
	showQuoteBar();
	showComposer(true);
}
function showQuoteBar() {
	if (!S.quote) { hideQuoteBar(); return; }
	$('qbarText').textContent = '引用 ' + (S.quote.from_name || '') + '：' + (S.quote.text || '').slice(0, 40);
	$('qbar').classList.add('on');
}
function hideQuoteBar() {
	$('qbar').classList.remove('on');
	$('qbarText').textContent = '';
}
function cancelQuote() {
	S.quote = null;
	hideQuoteBar();
}

/* ---- 引用跳转 ---- */
function jumpToMsg(id) {
	if (!id) return;
	var el = $('msgList').querySelector('[data-msg-id="' + id.replace(/"/g, '\\"') + '"]');
	if (!el) { toast('被引用的消息不在当前范围内'); return; }
	el.scrollIntoView({ block: 'center' });
	el.classList.add('hl');
	setTimeout(function () { el.classList.remove('hl'); }, 1200);
}

async function sendText() {
	if (!S.cur) return;
	var v = $('inMsg').value.trim();
	if (!v) return;
	var c = S.cur;
	var q = S.quote;
	$('inMsg').value = '';
	// 带引用时必须包成 v2 JSON（与 app.js 一致：v2 包装体里挂 quote 字段）
	var outBody = q
		? JSON.stringify({ v: 2, text: v, quote: q })
		: v;
	var payload = c.type === 'group'
		? { group_id: c.id, body: outBody, msg_type: 'text', media_url: '', thumb_url: '' }
		: { body: outBody, msg_type: 'text', media_url: '', thumb_url: '',
		    to_uid: c.toUid || c.id, to_ncuid: c.ncuid || c.id };
	var me = S.me || {};
	var tmp = {
		id: 'tmp' + Date.now(), from_uid: me.uid || '', from_ncuid: me.ncuid || '',
		from_name: me.display_name || me.username || '', from_avatar: me.avatar_url || '',
		body: outBody, msg_type: 'text', created_at: Math.floor(Date.now() / 1000)
	};
	S.msgs.push(tmp);
	S.sig = msgSig();
	renderMsgs();
	try {
		var d = c.type === 'group' ? await OC.sendGroup(payload) : await OC.sendDirect(payload);
		if (d && d.error) throw new Error(d.error);
		cancelQuote();                       // 发送成功才清引用
	} catch (e) {
		S.msgs.pop();
		S.sig = msgSig();
		renderMsgs();
		$('inMsg').value = v;                // 失败保留引用与文本，便于重试
		toast('发送失败：' + (e && e.message ? e.message : ''));
	}
}

async function sendImage(file) {
	if (!S.cur || !file) return;
	var c = S.cur;
	toast('上传中…');
	try {
		var fd = new FormData();
		fd.append('file', file);
		var up = await OC.uploadMedia(fd);
		if (up && up.error) throw new Error(up.error);
		var url = up.media_url || up.url || up.path || up.file_url || '';
		if (!url) throw new Error('上传未返回地址');
		var outBody = S.quote ? JSON.stringify({ v: 2, text: '', quote: S.quote }) : '';
		var payload = c.type === 'group'
			? { group_id: c.id, body: outBody, msg_type: 'image', media_url: url, thumb_url: up.thumb_url || '' }
			: { body: outBody, msg_type: 'image', media_url: url, thumb_url: up.thumb_url || '',
			    to_uid: c.toUid || c.id, to_ncuid: c.ncuid || c.id };
		var r = c.type === 'group' ? await OC.sendGroup(payload) : await OC.sendDirect(payload);
		if (r && r.error) throw new Error(r.error);
		cancelQuote();
		toast('');
		await loadMsgs(false);
	} catch (e) {
		toast('发送失败：' + (e && e.message ? e.message : ''));
	}
}

/* =====================================================================
   8.5 WebSocket 实时推送（主通道，HTTP 轮询降为兜底/安全网）
       - 复用 oldchat-ws-extension.js（OCWebSocket）：自带 ECDH 握手 + AES 信封解密 + 退避重连
       - WS 会话密钥由扩展包独立握手（与 HTTP 的 __httpSession 严格隔离，符合其设计约束）
       - 推送载荷格式与 app.js handleWsMessage 对齐：
           {type:'direct_message'|'group_message', data:{id,from_uid,from_ncuid,body,msg_type,created_at,group_id?}}
           或裸消息 {id,...,group_id?}（无 type 包装，按有无 group_id 判别）
           {type:'direct_recall'|'group_recall', data:{message_id,group_id?}}
           {type:'typing', data:{chat_id,uid,is_group,is_typing}}
           {type:'account_event', data:{type:'DIRECT_MESSAGE_NEW'|..., ...}}（差量再包装）
   ===================================================================== */
function initWs() {
	var token = null;
	try { token = localStorage.getItem(LS_TOKEN); } catch (e) {}
	if (!token) return;
	if (typeof OCWebSocket === 'undefined') { restartPoll(); return; }   // 无扩展包 → 纯轮询兜底
	try { window.WS_HOST = 'oc.mcl0.dpdns.org'; } catch (e) {}           // 显式指定 WS 主机（与 API 后端同域）
	if (S.ws) { try { S.ws.disconnect(); } catch (e) {} S.ws = null; }
	S.ws = new OCWebSocket({
		debug: false,
		reconnect: true,
		maxAttempts: Infinity,
		baseDelay: 1000,
		maxDelay: 30000,
		onConnectionLost: function () { S.wsLive = false; restartPoll(); }  // 彻底连不上 → 退回短轮询
	});
	S.ws.on('message', function (ev) {
		try { handleWsPush(ev && ev.data); } catch (e) {}
	});
	S.ws.on('connected', function () { S.wsLive = true; restartPoll(); });
	S.ws.on('disconnected', function () { S.wsLive = false; restartPoll(); });
	S.ws.on('error', function () {});   // 交给扩展包的退避重连，这里不额外处理
	S.ws.connect();
}

// 当前会话：追加一条消息（按 id 去重，避免 WS 与兜底轮询重复上屏）
function wsAppendMsg(d) {
	var id = d.id || '';
	if (!id) return;
	for (var i = 0; i < S.msgs.length; i++) if (S.msgs[i].id === id) return;
	var key = d.from_ncuid || d.from_uid || '';
	var info = S.members[key] || {};
	S.msgs.push({
		id: id,
		from_uid: d.from_uid || '',
		from_ncuid: d.from_ncuid || '',
		from_name: d.from_name || info.name || '',
		from_avatar: d.from_avatar || info.avatar || '',
		body: d.body || '',
		msg_type: d.msg_type || 'text',
		media_url: d.media_url || null,
		thumb_url: d.thumb_url || null,
		created_at: Number(d.created_at) || Math.floor(Date.now() / 1000)
	});
	if (S.msgs.length > MSG_CAP) S.msgs.shift();
	S.sig = msgSig();
	renderMsgs();
	markRead();
}

// 非当前会话：未读 +1、更新最后一条预览（不进后台缓存，切过去时由 API 全量拉取）
function wsBumpConv(convKey, d) {
	var c = null;
	for (var i = 0; i < S.convs.length; i++) if (S.convs[i].key === convKey) { c = S.convs[i]; break; }
	if (!c) { S.wsConvRefresh = true; return; }   // 陌生会话（如新拉的群）→ 标记列表刷新
	c.unread = (c.unread || 0) + 1;
	c.last = { ts: Number(d.created_at) || 0, text: bodyText(d.body) || phLabel(d.msg_type) };
	renderConvs();
}

var typingTimer = null;
function showTyping() {
	var el = $('chatTitle');
	if (!el || !S.cur) return;
	el.textContent = S.cur.name + ' · 输入中';
	if (typingTimer) clearTimeout(typingTimer);
	typingTimer = setTimeout(function () {
		if (S.cur) $('chatTitle').textContent = S.cur.name;
	}, 3000);
}

function handleWsPush(msg) {
	if (!msg) return;
	// 裸消息兼容（无 type 包装，按有无 group_id 判别方向）
	if (!msg.type && msg.id && (msg.from_uid || msg.from_ncuid) && msg.msg_type) {
		msg = msg.group_id ? { type: 'group_message', data: msg } : { type: 'direct_message', data: msg };
	}
	if (!msg || !msg.type) return;

	// account_event：差量再包装，展开内部事件后递归处理
	if (msg.type === 'account_event') {
		var inner = msg.data || msg.payload || {};
		var it = inner.type || inner.event_type || '';
		if (it === 'DIRECT_MESSAGE_NEW') {
			var m = inner.message || (inner.payload && (inner.payload.message || inner.payload)) || inner;
			handleWsPush({ type: 'direct_message', data: m });
		} else if (it === 'DIRECT_MESSAGE_RECALL') {
			handleWsPush({ type: 'direct_recall', data: { message_id: inner.message_id, from_uid: inner.from_ncuid || inner.from_uid } });
		} else if (it === 'GROUP_POINTER_UPDATE') {
			if (inner.group_id) loadMsgs(false);
		} else if (it === 'GROUP_MEMBERSHIP_CHANGE') {
			if (inner.group_id && S.cur && S.cur.type === 'group' && S.cur.id === inner.group_id) {
				loadMembers(S.cur).then(renderMsgs);
			}
		}
		return;
	}

	if (msg.type === 'direct_message') {
		var d = msg.data || {};
		if (isSelfId(d.from_ncuid, d.from_uid)) return;   // 忽略自己消息的回显，避免与乐观上屏重复
		var key = 'direct:' + (d.from_ncuid || d.from_uid || '');
		if (S.cur && S.cur.key === key) wsAppendMsg(d);
		else wsBumpConv(key, d);
	} else if (msg.type === 'group_message') {
		var gd = msg.data || {};
		if (isSelfId(gd.from_ncuid, gd.from_uid)) return;
		var gkey = 'group:' + (gd.group_id || '');
		if (S.cur && S.cur.key === gkey) wsAppendMsg(gd);
		else wsBumpConv(gkey, gd);
	} else if (msg.type === 'direct_recall' || msg.type === 'group_recall') {
		var rd = msg.data || {};
		var rid = rd.message_id;
		if (!rid) return;
		var inCur = (msg.type === 'direct_recall' && S.cur && S.cur.type === 'direct') ||
		            (msg.type === 'group_recall' && S.cur && S.cur.type === 'group');
		for (var i = 0; i < S.msgs.length; i++) {
			if (S.msgs[i].id === rid) {
				if (inCur) { S.msgs.splice(i, 1); S.sig = msgSig(); renderMsgs(); }
				break;
			}
		}
	} else if (msg.type === 'typing') {
		var td = msg.data || {};
		var tUid = td.uid || td.from_uid || td.from_ncuid || '';
		if (!tUid) return;
		var isGroup = td.is_group === true || !!td.group_id;
		var tKey = isGroup ? ('group:' + (td.chat_id || td.group_id || '')) : ('direct:' + tUid);
		if (S.cur && S.cur.key === tKey) showTyping();
	}
}

/* =====================================================================
   9. 轮询 + 输入区收起 / 上滑隐藏
   ===================================================================== */
function stopPoll() {
	if (S.timer) { clearInterval(S.timer); S.timer = null; }
}
function restartPoll() {
	stopPoll();
	if (document.hidden) return;
	var inChat = $('vChat').classList.contains('on');
	// WS 在线：只留 1 分钟安全网（防止 WS 静默失效丢消息）；
	// WS 离线：退回 25s/15s 短轮询兜底。
	var interval = S.wsLive ? POLL_SAFE : (inChat ? POLL_CHAT : POLL_LIST);
	S.timer = setInterval(tick, interval);
}
async function tick() {
	if (document.hidden) return;
	if (S.wsConvRefresh) { S.wsConvRefresh = false; loadConvs(); }  // WS 推来陌生会话 → 刷新列表
	if ($('vChat').classList.contains('on')) await loadMsgs(false);
	else await loadConvs();
}
document.addEventListener('visibilitychange', function () {
	if (document.hidden) { stopPoll(); return; }
	keepAlive();
	tick();
	restartPoll();
});
window.addEventListener('pagehide', stopPoll);
window.addEventListener('pageshow', function () {
	if (!document.hidden) { keepAlive(); tick(); restartPoll(); }
});

var msgTop = 0, composerHidden = false;
function showComposer(show) {
	if (composerHidden === !show) return;
	composerHidden = !show;
	$('composer').classList.toggle('hide', !show);
}
$('msgList').addEventListener('scroll', function () {
	var el = $('msgList');
	var top = el.scrollTop;
	var d = top - msgTop;
	msgTop = top;
	if (document.activeElement === $('inMsg') || $('inMsg').value) { showComposer(true); return; }
	if (el.scrollHeight - top - el.clientHeight < 10) { showComposer(true); return; }
	if (d > 4) showComposer(true);          // 向下滑 → 显示
	else if (d < -4) showComposer(false);   // 向上滑 → 隐藏
});

/* =====================================================================
   10. 长按引用
   ===================================================================== */
var lpTimer = null, lpX = 0, lpY = 0;
function closestMsg(el) {
	var root = $('msgList');
	while (el && el !== root) {
		if (el.classList && el.classList.contains('m')) return el;
		el = el.parentNode;
	}
	return null;
}
function lpCancel() { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } }
function lpBegin(el, x, y) {
	lpCancel();
	lpX = x; lpY = y;
	lpTimer = setTimeout(function () {
		lpTimer = null;
		var id = el.getAttribute('data-msg-id');
		for (var i = 0; i < S.msgs.length; i++) {
			if (S.msgs[i].id === id) { setQuote(S.msgs[i]); return; }
		}
	}, 550);
}
$('msgList').addEventListener('touchstart', function (e) {
	var el = closestMsg(e.target);
	if (!el || !e.touches || !e.touches.length) return;
	lpBegin(el, e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });
$('msgList').addEventListener('touchmove', function (e) {
	if (!lpTimer || !e.touches || !e.touches.length) return;
	if (Math.abs(e.touches[0].clientX - lpX) > 8 || Math.abs(e.touches[0].clientY - lpY) > 8) lpCancel();
}, { passive: true });
$('msgList').addEventListener('touchend', lpCancel);
$('msgList').addEventListener('touchcancel', lpCancel);
/* 桌面/调试用鼠标也能长按 */
$('msgList').addEventListener('mousedown', function (e) {
	var el = closestMsg(e.target);
	if (el) lpBegin(el, e.clientX, e.clientY);
});
$('msgList').addEventListener('mousemove', function (e) {
	if (lpTimer && (Math.abs(e.clientX - lpX) > 8 || Math.abs(e.clientY - lpY) > 8)) lpCancel();
});
$('msgList').addEventListener('mouseup', lpCancel);
$('msgList').addEventListener('mouseleave', lpCancel);

/* =====================================================================
   11. 事件绑定
   ===================================================================== */
$('loginForm').addEventListener('submit', function (e) { e.preventDefault(); doLogin(); });
$('btnLogout').addEventListener('click', logout);

function closestRow(el) {
	var root = $('convList');
	while (el && el !== root) {
		if (el.classList && el.classList.contains('row')) return el;
		el = el.parentNode;
	}
	return null;
}
$('convList').addEventListener('click', function (e) {
	var row = closestRow(e.target);
	if (!row) return;
	var k = row.getAttribute('data-key');
	if (k) openChat(k);
});

// 引用块点击 → 跳到被引用的消息（先于其它点击处理）
$('msgList').addEventListener('click', function (e) {
	var el = e.target;
	while (el && el !== $('msgList')) {
		if (el.classList && el.classList.contains('quote-block')) {
			jumpToMsg(el.getAttribute('data-quoted-id'));
			return;
		}
		el = el.parentNode;
	}
});

$('btnBack').addEventListener('click', function () { openList(false); });
$('qbarX').addEventListener('click', cancelQuote);

$('btnSend').addEventListener('click', sendText);
$('inMsg').addEventListener('keydown', function (e) {
	if (e.key !== 'Enter') return;
	if (e.isComposing || e.keyCode === 229) return;   // 中文输入法候选确认，不当作发送
	e.preventDefault();
	sendText();
});
$('btnPlus').addEventListener('click', function () { $('filePick').click(); });
$('filePick').addEventListener('change', function (e) {
	var f = e.target.files && e.target.files[0];
	e.target.value = '';
	if (!f) return;
	if (!/^image\//.test(f.type)) { toast('暂只支持图片'); return; }
	sendImage(f);
});

/* =====================================================================
   12. 启动
   ===================================================================== */
async function boot() {
	var token = null, user = null;
	try {
		token = localStorage.getItem(LS_TOKEN);
		user = JSON.parse(localStorage.getItem(LS_USER) || 'null');
	} catch (e) {}
	if (!token) { show('vLogin'); return; }
	S.me = user || {};
	loadConvCache();          // 先用缓存立即出列表
	show('vList');
	// 先续期：若刷新失败说明 token 已死，直接回内联登录页，
	// 避免带着过期 token 打接口触发 SDK 内部「刷新失败→硬跳 login.html」。
	if (!(await keepAlive(true))) {
		try {
			localStorage.removeItem(LS_TOKEN);
			localStorage.removeItem('oc_refresh_token');
			localStorage.removeItem(LS_USER);
		} catch (e) {}
		S.me = null; show('vLogin');
		toast('登录已失效，请重新登录');
		return;
	}
	startKeepAlive();
	loadMe();
	loadConvs();
	restartPoll();
	initWs();               // 已有 token：直接建 WS 实时通道（失败自动降级轮询）
}
boot();

})();
</script>
