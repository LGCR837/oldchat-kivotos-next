worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # ===== 媒体文件代理缓存（本地磁盘缓存，nginx 重启仍保留） =====
    proxy_cache_path  temp/media_cache  levels=1:2  keys_zone=media_cache:16m
                      max_size=8g  inactive=365d  use_temp_path=off;

    server {
        listen       5520;
        server_name  localhost;

        # WebSocket proxy
        location /v1/ws {
            proxy_pass http://oc.mcl0.dpdns.org;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host oc.mcl0.dpdns.org;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ===== 媒体类请求（走 /v1/media、/media、/avatar、/cover、/static、/files、含后缀的静态资源） =====
        # 同时使用：
        #   1. proxy_cache 本地磁盘缓存（永久，inactive=365d 不会被清）
        #   2. 向浏览器输出强 Cache-Control（前端 HTTP 缓存层）
        location ~* ^/(v1/)?(media|avatar|avatars|cover|covers|file|files|static|upload|uploads|image|images|audio|audios|video|videos|thumb|thumbnails|music|musics|song|songs|emoji|emoticons|sticker|stickers)/ {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Range" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Range" always;
                add_header Access-Control-Max-Age 86400;
                add_header Cache-Control "public, max-age=31536000, immutable" always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            proxy_pass http://oc.mcl0.dpdns.org;
            proxy_set_header Host oc.mcl0.dpdns.org;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_cache media_cache;
            proxy_cache_valid  200 301 302 304  365d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_key "$scheme$proxy_host$request_uri";
            proxy_cache_background_update on;
            proxy_read_timeout 300s;
        }

        # ===== 纯后缀匹配的媒体请求（直接请求图片/音频/视频后缀的 URL） =====
        location ~* \.(png|jpe?g|gif|webp|bmp|ico|svg|avif|mp3|wav|flac|aac|m4a|ogg|opus|mp4|webm|mov|ogv|pdf|woff2?|ttf|eot)$ {
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;

            # 如果是本地静态资源（存在于 src 目录），直接本地返回
            try_files $uri @proxy_media;
        }

        location @proxy_media {
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;

            proxy_pass http://oc.mcl0.dpdns.org;
            proxy_set_header Host oc.mcl0.dpdns.org;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_cache media_cache;
            proxy_cache_valid  200 301 302 304  365d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_key "$scheme$proxy_host$request_uri";
            proxy_cache_background_update on;
            proxy_read_timeout 300s;
        }

        # API proxy with CORS（非媒体的 /v1/ 接口，不缓存）
        location /v1/ {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            proxy_pass http://oc.mcl0.dpdns.org;
            proxy_set_header Host oc.mcl0.dpdns.org;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 本地前端静态文件
        location / {
            root   src;
            index  index.html;
            try_files $uri $uri/ $uri.html =404;
            # 静态 assets（字体/图标等）也走长期缓存
            location ~* \.(png|jpe?g|gif|webp|svg|ico|woff2?|ttf|eot|css|js)$ {
                add_header Cache-Control "public, max-age=31536000, immutable";
            }
        }
    }
}
