[package]
name = "oldchat-kivotos-next-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oldchat_kivotos_next_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CIP 本地小程序：解压用户上传的 .cip/.zip 包（仅 deflate / 存储，加密/bzip2/zstd 暂不支持）
zip = { version = "0.6", default-features = false, features = ["deflate"] }
raw-window-handle = "0.6"

# Windows 平台 Win32 API：
#   Win32_UI_WindowsAndMessaging - 任务栏闪烁 FlashWindowEx / 启动自检弹窗 MessageBoxW
#   Win32_System_Registry        - 启动自检读取 WebView2 版本与系统内部版本号
#   Win32_UI_Shell               - 启动自检弹窗里的「前往下载」ShellExecuteW
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }

# 单实例防重复启动：仅桌面端（移动端无此概念，其 API 为桌面专属）。
# 注意：Tauri 的 `cfg(desktop)` 由 build script 注入，Cargo 解析依赖时不认；
# 这里用 Cargo 能识别的标准 cfg：非 android 且非 ios 即视为桌面端。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
# 禁用浏览器级默认快捷键（Ctrl+P/F/G/J、Ctrl+Shift+I、F3、F7 等），仅桌面端。
# platform-windows 特性提供 WebView2 层 browser_accelerator_keys 开关，彻底掐掉
# JS 层面拦不住的浏览器级组合键（Ctrl+P / Ctrl+Shift+I）。
tauri-plugin-prevent-default = { version = "5", features = ["platform-windows"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
