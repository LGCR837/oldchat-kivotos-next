# 临时热修 workflow —— 仅重建 v10 Release 缺失的 2 个 macOS dmg 资产。
# 使用方法（GitHub 控制台 → Actions → macOS Hotfix (v10) → Run workflow）：
#   直接点 Run（release_tag 默认 v10）。构建从 main 拉取（已含 preflight.rs 修复），
#   产物补传到现有 v10 Release；不动 tag，不改变任何 commit Hash。
# 跑完确认无误后请删除本文件（临时用）。
name: macOS Hotfix (v10)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '目标 Release tag，把 macOS dmg 补传到该已存在 Release'
        required: true
        default: 'v10'
        type: string

permissions:
  contents: write

jobs:
  macos-hotfix:
    name: Build and Upload macOS dmg (${{ matrix.asset_suffix }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            asset_suffix: macos-aarch64
          - platform: macos-latest
            target: x86_64-apple-darwin
            asset_suffix: macos-x64
    runs-on: ${{ matrix.platform }}
    steps:
      # 关键：显式拉 main（已含 preflight.rs 修复），而非 tag 旧 commit（带 bug 必挂）
      - name: Checkout repository (fixed main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      # 把 tag 解析成 release 数字 ID，供 tauri-action 上传到现有 Release
      - name: Resolve release id for ${{ github.event.inputs.release_tag }}
        id: rel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.inputs.release_tag }}"
          rid=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id')
          echo "id=$rid" >> "$GITHUB_OUTPUT"
          echo "Resolved release id: $rid"

      # 未签名 dmg：与正式 release.yml 的 macos job 完全一致（仅 dmg 目标）
      - name: Build and upload Tauri bundle (unsigned dmg)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ steps.rel.outputs.id }}
          args: --bundles dmg --target ${{ matrix.target }}
